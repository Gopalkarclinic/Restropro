<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#6B1E1E">
<title>Dashboard</title>
<link rel="stylesheet" href="dashboard.css">
</head>
<body>
<section id="login" hidden>
  <form id="lf">
    <h1>Restropro</h1>
    <p>Owner / Manager login</p>
    <label>Email<input id="em" type="email" autocomplete="username" required></label>
    <label>Password<input id="pw" type="password" autocomplete="current-password" required></label>
    <p id="lerr" class="err"></p>
    <button type="submit" id="lbtn">Login</button>
  </form>
</section>

<section id="dash" hidden>
  <header>
    <div><h1 id="rname">Dashboard</h1><span class="live"><i></i> LIVE</span></div>
    <div class="actions">
      <div class="tabs" id="tabs">
        <button data-d="1" class="on">Aaj</button><button data-d="7">7 din</button><button data-d="30">30 din</button>
      </div>
      <button id="out" class="ghost">Logout</button>
    </div>
  </header>
  <main>
    <div class="tiles">
      <div class="tile big"><span>Bikri (GST sahit)</span><b id="k-sales">-</b></div>
      <div class="tile"><span>Bills</span><b id="k-bills">-</b></div>
      <div class="tile"><span>Average bill</span><b id="k-avg">-</b></div>
      <div class="tile"><span>Orders</span><b id="k-orders">-</b></div>
      <div class="tile"><span>QR se aaye</span><b id="k-qr">-</b></div>
      <div class="tile"><span>Cancel</span><b id="k-cancel">-</b></div>
      <div class="tile"><span>Kitchen ka average time</span><b id="k-prep">-</b></div>
      <div class="tile"><span>GST (CGST + SGST)</span><b id="k-gst">-</b></div>
    </div>

    <h2>Abhi chal rahe orders <small id="active-count"></small></h2>
    <div class="board" id="board"></div>

    <div class="two">
      <div class="panel"><h2>Ghante ke hisaab se bikri</h2><div class="bars" id="bars"></div></div>
      <div class="panel"><h2>Sabse zyada bikne wali dishes</h2><ol id="top"></ol></div>
    </div>
    <p class="foot" id="foot"></p>
  </main>
</section>
<script src="/vendor/supabase.js"></script>
<script src="config.js"></script>
<script src="dashboard.js"></script>
</body>
</html>
