<!doctype html>
<html lang="mr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#6B1E1E">
<link rel="manifest" href="manifest.webmanifest">
<title>Menu</title>
<style>
:root{--maroon:#6B1E1E;--haldi:#E0A100;--cream:#FFF8EC;--ink:#2a1a14}
*{box-sizing:border-box}
body{margin:0;background:var(--cream);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans Devanagari",Roboto,sans-serif;padding-bottom:96px}
header{background:var(--maroon);color:#fff;padding:20px 16px 16px}
header h1{margin:0;font-size:24px}
header p{margin:4px 0 0;opacity:.85}
main{padding:12px;max-width:560px;margin:0 auto}
.item{display:flex;align-items:center;gap:12px;background:#fff;border-radius:14px;padding:14px;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.item.off{opacity:.45}
.info{flex:1}.name{font-size:18px;font-weight:600}.price{color:var(--maroon);font-weight:700;margin-top:2px}
.qty{display:flex;align-items:center;gap:10px}
button{font:inherit;border:0;cursor:pointer}
.qty button{width:44px;height:44px;border-radius:12px;background:var(--haldi);font-size:22px;font-weight:700;color:var(--ink)}
.qty span{min-width:20px;text-align:center;font-size:18px;font-weight:700}
.bar{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:var(--cream);border-top:1px solid #e8dcc4}
.bar button{width:100%;height:56px;border-radius:14px;background:var(--maroon);color:#fff;font-size:18px;font-weight:700}
.bar button:disabled{background:#b9a;opacity:.7}
.msg{text-align:center;padding:48px 20px;font-size:18px}
.ok{background:#fff;border-radius:16px;padding:24px;text-align:center;margin-top:24px}
.ok h2{margin:0 0 8px;color:var(--maroon)}
</style>
</head>
<body>
<header><h1 id="rname">Menu</h1><p id="tinfo"></p></header>
<main id="app"><div class="msg">Menu load ho raha hai...</div></main>
<div class="bar" id="bar" hidden><button id="send" disabled>Order bhejo</button></div>
<script src="config.js"></script>
<script>
(function(){
  var C = window.RESTROPRO, q = new URLSearchParams(location.search);
  var slug = (q.get('r')||'').toLowerCase(), table = (q.get('t')||'').slice(0,10);
  var app = document.getElementById('app'), bar = document.getElementById('bar'), send = document.getElementById('send');
  var cart = {}, items = [], idemKey = null;

  function el(tag, cls, text){ var e=document.createElement(tag); if(cls) e.className=cls; if(text!==undefined) e.textContent=text; return e; }
  function rupees(p){ return '₹' + (p/100).toFixed(p%100 ? 2 : 0); }
  function msg(t){ app.replaceChildren(el('div','msg',t)); bar.hidden = true; }

  if(!/^[a-z0-9-]{3,40}$/.test(slug) || !table){ msg('QR code sahi nahi hai. Waiter ko bulayein.'); return; }
  document.getElementById('tinfo').textContent = 'Table ' + table;

  fetch(C.SUPABASE_URL + '/rest/v1/menu_items?select=id,name,price_paise,is_available,restaurants!inner(name,slug)&restaurants.slug=eq.' + encodeURIComponent(slug) + '&order=name',
    { headers: { apikey: C.SUPABASE_KEY } })
  .then(function(r){ if(!r.ok) throw 0; return r.json(); })
  .then(function(rows){
    if(!rows.length){ msg('Menu abhi available nahi hai.'); return; }
    items = rows;
    document.getElementById('rname').textContent = rows[0].restaurants.name;
    document.title = rows[0].restaurants.name;
    render(); bar.hidden = false;
  }).catch(function(){ msg('Menu load nahi hua. Internet check karein.'); });

  function render(){
    var list = document.createDocumentFragment();
    items.forEach(function(it){
      var row = el('div','item' + (it.is_available ? '' : ' off'));
      var info = el('div','info'); info.append(el('div','name',it.name), el('div','price', it.is_available ? rupees(it.price_paise) : 'Abhi khatam'));
      row.append(info);
      if(it.is_available){
        var qty = el('div','qty'), minus = el('button',null,'−'), n = el('span',null,String(cart[it.id]||0)), plus = el('button',null,'+');
        minus.onclick = function(){ cart[it.id]=Math.max(0,(cart[it.id]||0)-1); n.textContent=cart[it.id]; update(); };
        plus.onclick = function(){ cart[it.id]=Math.min(99,(cart[it.id]||0)+1); n.textContent=cart[it.id]; update(); };
        minus.setAttribute('aria-label','kam karo'); plus.setAttribute('aria-label','badhao');
        qty.append(minus,n,plus); row.append(qty);
      }
      list.append(row);
    });
    app.replaceChildren(list); update();
  }

  function update(){
    var count=0,total=0;
    items.forEach(function(it){ var c=cart[it.id]||0; count+=c; total+=c*it.price_paise; });
    send.disabled = count===0;
    send.textContent = count ? ('Order bhejo • ' + count + ' item • ' + rupees(total)) : 'Order bhejo';
    idemKey = null; // cart changed -> a new order
  }

  send.onclick = function(){
    var lines = items.filter(function(it){return cart[it.id]>0;}).map(function(it){return {menuItemId:it.id, qty:cart[it.id]};});
    if(!lines.length) return;
    if(!idemKey) idemKey = (crypto.randomUUID ? crypto.randomUUID() : String(Date.now())+Math.random().toString(36).slice(2));
    send.disabled = true; send.textContent = 'Bhej rahe hain...';
    fetch(C.API_BASE + '/api/public/orders', { method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({restaurantSlug:slug, tableNo:table, idempotencyKey:idemKey, items:lines}) })
    .then(function(r){ if(r.status===422) return r.json().then(function(j){ throw j.error; }); if(!r.ok) throw 0; return r.json(); })
    .then(function(){
      var ok = el('div','ok'); ok.append(el('h2',null,'Order mil gaya!'), el('p',null,'Waiter confirm karenge, phir kitchen me jayega.'));
      app.replaceChildren(ok); bar.hidden = true; cart = {};
    }).catch(function(e){
      send.disabled = false; update();
      alert(e==='item_unavailable' ? 'Koi item abhi available nahi hai. Page refresh karein.' : 'Order nahi gaya. Internet check karke dobara dabayein.');
    });
  };
})();
</script>
</body>
</html>
